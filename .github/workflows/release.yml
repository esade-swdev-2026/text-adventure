# Runs when a version tag (v0.7, v1.0, ...) is pushed. It packs the built-in world into
# world.zip (world.json plus the art/ folder it names), proves the Docker image can load
# that zip from a bind mount, exactly as the README's "Run with Docker" section does, and
# only then publishes the image to GitHub Container Registry (ghcr.io) and a GitHub release
# with world.zip attached. The demo pulls that image; nothing is pushed by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload world.zip
  packages: write # needed to push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Pack the world into world.zip
        working-directory: src/text_adventure
        run: zip -r "$GITHUB_WORKSPACE/world.zip" world.json art

      - name: Build the image
        run: docker build -t text-adventure .

      - name: Check the zipped world from a bind mount, as the README does
        run: |
          unzip world.zip -d my-world
          docker run --rm -v "$PWD/my-world":/world:ro text-adventure check /world/world.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image to ghcr.io
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker tag text-adventure "$IMAGE:$GITHUB_REF_NAME"
          docker tag text-adventure "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"

      - name: Run the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker rmi "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest" text-adventure
          docker run --rm "$IMAGE:$GITHUB_REF_NAME" --help

      - name: Publish the release with world.zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" world.zip --title "$GITHUB_REF_NAME" --generate-notes
