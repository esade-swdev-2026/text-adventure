# Optional: run the same lint, format and type checks before each commit instead of
# waiting for CI. Install with `uv run pre-commit install`. Not required to pass the
# course — CI is the referee — but it catches things earlier.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # mypy runs from the project's own environment, exactly as CI does (strict, from
  # pyproject.toml), so it sees the package, rich, typer and pytest.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests scripts
        language: system
        pass_filenames: false
        types: [python]
